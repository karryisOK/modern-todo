name: Build & Release

# 触发方式：
# 1. 推送 v 开头的 tag（如 v1.0.0）→ 自动构建并创建 GitHub Release（草稿）
# 2. Actions 页面手动点 "Run workflow" → 只构建，产物在 workflow 的 Artifacts 里下载
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # 创建 Release 需要
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust-target: "" # Windows 原生 x64
          - platform: macos-latest
            rust-target: aarch64-apple-darwin # Apple Silicon (M1/M2/M3)
          - platform: macos-13
            rust-target: x86_64-apple-darwin # Intel Mac
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tag 触发时发布到 Release；手动触发时 tagName 为空则只构建
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "摩登待办 ${{ github.ref_name }}"
          releaseBody: |
            ## 摩登待办 ${{ github.ref_name }}
            下载对应系统的安装包：
            - Windows: `摩登待办_*_x64-setup.exe`
            - Apple Silicon Mac: `摩登待办_*_aarch64.dmg`
            - Intel Mac: `摩登待办_*_x64.dmg`
            > 未签名：Windows 首次安装若弹 SmartScreen，点「更多信息 → 仍要运行」；
            > macOS 首次打开请右键 → 打开，或执行 `xattr -cr /Applications/摩登待办.app`。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.rust-target && format('--target {0}', matrix.rust-target) || '' }}

      # 手动触发（无 tag）时，把安装包作为 workflow Artifact 上传以便下载
      - name: Upload installers (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: 摩登待办-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/dmg/*.dmg
          if-no-files-found: error
